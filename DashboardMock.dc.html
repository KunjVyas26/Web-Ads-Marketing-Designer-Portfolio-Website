<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
  @media (max-width:640px){
    [data-dm-grid]{grid-template-columns:1fr !important}
    [data-dm-side]{display:none !important}
  }
</style>
</helmet>
<div style="font-family:'Roboto','Helvetica Neue',Arial,sans-serif;background:#fff;height:100%;display:flex;flex-direction:column">
  <div style="height:30px;flex:none;background:#0e2536;display:flex;align-items:center;gap:6px;padding:0 13px"><span style="width:8px;height:8px;border-radius:50%;background:#ff5f56"></span><span style="width:8px;height:8px;border-radius:50%;background:#ffbd2e"></span><span style="width:8px;height:8px;border-radius:50%;background:#27c93f"></span><span style="margin-left:11px;font-size:10px;color:#7f95a8;font-weight:600">northwind</span></div>
  <div style="flex:1;display:grid;grid-template-columns:132px 1fr;min-height:0" data-dm-grid>
    <div style="background:#0E2A40;padding:14px 12px;display:flex;flex-direction:column;gap:5px" data-dm-side>
      <div style="display:flex;align-items:center;gap:7px;padding:0 4px 12px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)"><span style="width:22px;height:22px;border-radius:6px;background:linear-gradient(150deg,#3BB54A,#155EA0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900">◆</span><span style="color:#fff;font-family:'Roboto Condensed';font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.02em">Northwind</span></div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:rgba(255,255,255,.12)"><span style="width:14px;height:14px;border-radius:4px;background:#3BB54A"></span><span style="color:#fff;font-size:11px;font-weight:700">Overview</span></div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px"><span style="width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.28)"></span><span style="color:#aab8c4;font-size:11px;font-weight:600">Reports</span></div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px"><span style="width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.28)"></span><span style="color:#aab8c4;font-size:11px;font-weight:600">Sources</span></div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px"><span style="width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.28)"></span><span style="color:#aab8c4;font-size:11px;font-weight:600">Team</span></div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;margin-top:auto"><span style="width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.28)"></span><span style="color:#aab8c4;font-size:11px;font-weight:600">Settings</span></div>
    </div>
    <div style="padding:14px 16px;background:#fff;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div><div style="font-size:14px;font-weight:900;color:#0E2A40">Overview</div><div style="font-size:10px;color:#8A8A8A;font-weight:600">Last 30 days</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="display:flex;align-items:center;gap:6px;background:#F1F3F6;border-radius:7px;padding:6px 10px;font-size:10px;color:#8A8A8A;font-weight:600">⌕ Search</span>
          <span style="background:#3BB54A;color:#06331a;font-size:10.5px;font-weight:800;padding:7px 11px;border-radius:7px">+ New</span>
          <span style="width:26px;height:26px;border-radius:50%;background:#155EA0;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">JR</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="background:#EAF3FB;border-radius:9px;padding:11px"><div style="font-size:9px;font-weight:700;color:#5B7A97;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Signups</div><div style="display:flex;align-items:baseline;gap:5px"><span style="font-family:'Roboto Condensed';font-size:20px;font-weight:900;color:#155EA0">38%</span><span style="font-size:9px;font-weight:800;color:#15803D">▲</span></div></div>
        <div style="background:#E7F6ED;border-radius:9px;padding:11px"><div style="font-size:9px;font-weight:700;color:#4E8365;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Visitors</div><div style="display:flex;align-items:baseline;gap:5px"><span style="font-family:'Roboto Condensed';font-size:20px;font-weight:900;color:#15803D">1.2k</span><span style="font-size:9px;font-weight:800;color:#15803D">▲</span></div></div>
        <div style="background:#FFF1E0;border-radius:9px;padding:11px"><div style="font-size:9px;font-weight:700;color:#A9803F;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Revenue</div><div style="display:flex;align-items:baseline;gap:5px"><span style="font-family:'Roboto Condensed';font-size:20px;font-weight:900;color:#E07A1F">$94k</span><span style="font-size:9px;font-weight:800;color:#15803D">▲</span></div></div>
      </div>
      <div style="background:#F6F8FA;border:1px solid #E6E8EB;border-radius:9px;padding:12px 12px 10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="font-size:10.5px;font-weight:800;color:#0E2A40">Weekly signups</div><div style="display:flex;gap:10px"><span style="display:flex;align-items:center;gap:4px;font-size:9px;color:#8A8A8A;font-weight:700"><span style="width:8px;height:8px;border-radius:2px;background:#155EA0"></span>This wk</span><span style="display:flex;align-items:center;gap:4px;font-size:9px;color:#8A8A8A;font-weight:700"><span style="width:8px;height:8px;border-radius:2px;background:#3BB54A"></span>Goal</span></div></div>
        <div style="display:flex;align-items:flex-end;gap:7px;height:86px">
          <span style="flex:1;height:40%;background:#B7D3EC;border-radius:4px 4px 0 0"></span><span style="flex:1;height:62%;background:#8FBFE4;border-radius:4px 4px 0 0"></span><span style="flex:1;height:50%;background:#B7D3EC;border-radius:4px 4px 0 0"></span><span style="flex:1;height:80%;background:#155EA0;border-radius:4px 4px 0 0"></span><span style="flex:1;height:70%;background:#8FBFE4;border-radius:4px 4px 0 0"></span><span style="flex:1;height:96%;background:#3BB54A;border-radius:4px 4px 0 0"></span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid #E6E8EB"><span style="font-size:8.5px;color:#B4BCC4;font-weight:700">Mon</span><span style="font-size:8.5px;color:#B4BCC4;font-weight:700">Tue</span><span style="font-size:8.5px;color:#B4BCC4;font-weight:700">Wed</span><span style="font-size:8.5px;color:#B4BCC4;font-weight:700">Thu</span><span style="font-size:8.5px;color:#B4BCC4;font-weight:700">Fri</span><span style="font-size:8.5px;color:#B4BCC4;font-weight:700">Sat</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:320}}"></script>
</body>
</html>
