<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Roboto','Helvetica Neue',Arial,sans-serif;background:#fff;height:100%;display:flex;flex-direction:column;min-height:0">
  <div style="flex:none;background:#fff;border-bottom:1px solid #E6E8EB;padding:9px 13px;display:flex;align-items:center;gap:10px">
    <span style="flex:none;width:26px;height:26px;border-radius:50%;background:#155EA0;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">{{ brand }}</span>
    <div style="min-width:0;flex:1"><div style="font-size:11.5px;font-weight:900;color:#1F2A33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ subject }}</div><div style="font-size:9.5px;color:#8A8A8A;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sender }} · {{ preheader }}</div></div>
  </div>
  <div style="flex:1;min-height:0;overflow:hidden;background:#EEF1F4">
    <div style="background:#fff">
      <div style="background:{{ bg }};padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
        <span style="color:#fff;font-family:'Roboto Condensed';font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase">{{ brand }}</span>
        <span style="color:rgba(255,255,255,.82);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">{{ brandTag }}</span>
      </div>
      <div style="padding:18px 18px 12px;text-align:center;background:linear-gradient(180deg,#F6F8FA,#fff)">
        <span style="display:inline-block;font-size:9px;font-weight:800;color:{{ accentText }};background:{{ accentBg }};padding:4px 10px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:9px">{{ eyebrow }}</span>
        <div style="font-family:'Roboto Condensed';font-size:19px;font-weight:900;color:#0E2A40;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05;margin-bottom:7px">{{ headline }}</div>
        <p style="margin:0 auto;max-width:40ch;font-size:11px;color:#4A5560;line-height:1.5">{{ sub }}</p>
      </div>
      <div style="padding:0 18px 14px">
        <div style="border-radius:10px;overflow:hidden;background:{{ bg }};aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;position:relative">
          <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:26px 26px"></div>
          <span style="position:relative;color:rgba(255,255,255,.92);font-family:'Roboto Condensed';font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.02em">{{ imgLabel }}</span>
        </div>
      </div>
      <div style="padding:0 18px 20px;text-align:center">
        <span style="display:inline-block;background:{{ cta }};color:#fff;font-weight:900;font-size:12.5px;padding:11px 26px;border-radius:9px;box-shadow:0 8px 18px rgba(16,34,51,.16)">{{ ctaLabel }}</span>
      </div>
      <div style="background:#0E2A40;padding:14px 16px;text-align:center">
        <div style="color:#fff;font-family:'Roboto Condensed';font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">{{ brand }}</div>
        <div style="font-size:9px;color:#8da0ae;line-height:1.5">123 Market St, San Francisco, CA · <span style="color:#aab8c4">Unsubscribe</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:460}}"></script>
</body>
</html>
